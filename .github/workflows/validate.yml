name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: The lexicon must match its semantic map
        run: |
          python3 build_lexicon.py
          git diff --exit-code lexicon.tsv

      - name: The language must obey its own rules
        run: python3 senel.py validate

      - name: Every example in the docs must parse
        run: python3 tests/test_examples.py

      - name: English normalisation and fallback regressions
        run: python3 tests/test_translation.py

      - name: Everyday English coverage must not regress
        run: python3 tests/test_coverage.py

      - name: The web translator's data must be current
        run: |
          python3 translate.py data
          git diff --exit-code docs/data.js docs/aliases.js

      - name: Python and JavaScript must translate identically
        run: python3 tests/test_parity.py

      - name: The public site must expose current discovery metadata
        run: python3 tests/test_site_metadata.py
